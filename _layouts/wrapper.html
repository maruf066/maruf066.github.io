<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/syntax.css">
    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
    <title>{{ site.title }}</title>
</head>
<body>

    <!-- ================= NAVBAR START ================= -->
    {% if page.url == "/" or page.url == "/index.html" %}
      <!-- HOME PAGE NAVBAR (Light background, black text) -->
      <div style="position: relative !important; width: 100% !important; z-index: 99999 !important; display: flex !important; justify-content: space-between !important; align-items: center !important; padding: 20px 40px !important; box-sizing: border-box !important; background: #f8f9fa !important; border-bottom: 1px solid #ddd !important; font-family: Georgia, 'Times New Roman', serif !important;">
          <div style="display: flex !important; align-items: center !important; gap: 15px !important;">
              <img src="{{ site.baseurl }}/assets/images/profile-image/avatar.jpeg" alt="Profile" style="width: 45px !important; height: 45px !important; border-radius: 4px !important; object-fit: cover !important; display: block !important;">
              <a href="{{ site.baseurl }}/" style="font-size: 1.4rem !important; font-weight: bold !important; color: #000000 !important; text-decoration: none !important;">MD MARUF AHMED</a>
          </div>
          <div style="display: flex !important; align-items: center !important; gap: 25px !important;">
              <a href="{{ site.baseurl }}/" style="font-size: 1.1rem !important; color: #333333 !important; text-decoration: none !important;">Home</a>
              <a href="{{ site.baseurl }}/education/" style="font-size: 1.1rem !important; color: #333333 !important; text-decoration: none !important;">Education</a>
              <a href="{{ site.baseurl }}/research/" style="font-size: 1.1rem !important; color: #333333 !important; text-decoration: none !important;">Research</a>
              <a href="{{ site.baseurl }}/projects/" style="font-size: 1.1rem !important; color: #333333 !important; text-decoration: none !important;">Projects</a>
              <a href="{{ site.baseurl }}/experiences/" style="font-size: 1.1rem !important; color: #333333 !important; text-decoration: none !important;">Experiences</a>
          </div>
      </div>
    {% else %}
      <!-- OTHER PAGES NAVBAR (Transparent background, PURE WHITE text) -->
      <div style="position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; z-index: 99999 !important; display: flex !important; justify-content: space-between !important; align-items: center !important; padding: 20px 40px !important; box-sizing: border-box !important; background: transparent !important; font-family: Georgia, 'Times New Roman', serif !important;">
          <div style="display: flex !important; align-items: center !important; gap: 15px !important;">
              <img src="{{ site.baseurl }}/assets/images/profile-image/avatar.jpeg" alt="Profile" style="width: 45px !important; height: 45px !important; border-radius: 4px !important; object-fit: cover !important; display: block !important;">
              <a href="{{ site.baseurl }}/" style="font-size: 1.4rem !important; font-weight: bold !important; color: #ffffff !important; text-decoration: none !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.9) !important;">MD MARUF AHMED</a>
          </div>
          <div style="display: flex !important; align-items: center !important; gap: 25px !important;">
              <a href="{{ site.baseurl }}/" style="font-size: 1.1rem !important; color: #ffffff !important; text-decoration: none !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.9) !important;">Home</a>
              <a href="{{ site.baseurl }}/education/" style="font-size: 1.1rem !important; color: #ffffff !important; text-decoration: none !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.9) !important;">Education</a>
              <a href="{{ site.baseurl }}/research/" style="font-size: 1.1rem !important; color: #ffffff !important; text-decoration: none !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.9) !important;">Research</a>
              <a href="{{ site.baseurl }}/projects/" style="font-size: 1.1rem !important; color: #ffffff !important; text-decoration: none !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.9) !important;">Projects</a>
              <a href="{{ site.baseurl }}/experiences/" style="font-size: 1.1rem !important; color: #ffffff !important; text-decoration: none !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.9) !important;">Experiences</a>
          </div>
      </div>
    {% endif %}
    <!-- ================= NAVBAR END ================= -->

    <div class="page">{{content}}</div>
</body>
{% include footer.html %}
</html>
