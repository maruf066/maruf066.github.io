<!-- _includes/nav.html -->
<style>
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: nowrap;
        padding: 10px 20px;
    }
    nav .left a {
        font-weight: bold;
        font-size: 1.4rem;
        white-space: nowrap;
        text-decoration: none;
        color: inherit;
    }
    nav .right.desktop-nav {
        display: flex;
        align-items: center;
        gap: 20px; /* Increased gap slightly for the cleaner look */
        white-space: nowrap;
    }
    nav .right.desktop-nav a {
        font-size: 1rem;
        text-decoration: none;
        color: inherit;
    }
    .menu-toggle, .mobile-nav { display: none; }
    @media (max-width: 900px) {
        .desktop-nav { display: none !important; }
        .menu-toggle { display: block; }
    }
</style>

<nav>
    <div class="left">
        <a href="{{ site.baseurl }}/">{{site.name}}</a>
    </div>

    <!-- Desktop Menu -->
    <div class="right desktop-nav">
        <a href="{{ site.baseurl }}/"><span>Home</span></a>
        <a href="{{ site.baseurl }}/experiences/"><span>Experiences</span></a>
        <a href="{{ site.baseurl }}/projects/"><span>Projects</span></a>
        <a href="{{site.resume-url}}" target="_blank" rel="noopener noreferrer"><span>Resume</span></a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" aria-label="Toggle menu">
        <i class="fa fa-bars fa-2x"></i>
    </button>

    <!-- Mobile Menu -->
    <div class="mobile-nav">
        <a href="{{ site.baseurl }}/"><span>Home</span></a>
        <a href="{{ site.baseurl }}/experiences/"><span>Experiences</span></a>
        <a href="{{ site.baseurl }}/projects/"><span>Projects</span></a>
        <a href="{{site.resume-url}}" target="_blank" rel="noopener noreferrer"><span>Resume</span></a>
    </div>
</nav>
