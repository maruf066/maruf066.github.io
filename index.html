<style>
  /* Import Poppins Font */
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

  .home-container {
    font-family: 'Poppins', sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 60px;
  }

  .home-text {
    flex: 1;
  }

  /* Name and Social Icons Container */
  .name-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 10px;
  }

  .home-text h1 {
    font-size: 4rem;
    font-weight: 700;
    color: #000;
    margin: 0;
    line-height: 1.1;
  }

  /* Social Icons Styling */
  .social-icons {
    display: flex;
    gap: 15px;
  }

  .social-icons a {
    color: #000;
    font-size: 1.5rem;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .social-icons a:hover {
    color: #40b3a2; /* Teal color on hover */
  }

  .home-text h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: #333;
    margin: 0 0 20px 0;
  }

  .home-text p {
    font-size: 1.1rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 35px;
  }

  .home-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .home-buttons a {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    color: #40b3a2;
    text-decoration: none;
    border: 2px solid #40b3a2;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  .home-buttons a:hover {
    background-color: #40b3a2;
    color: #ffffff;
  }

  .home-image {
    flex-shrink: 0;
  }

  .home-image img {
    width: 400px;
    height: 400px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  /* More About Me Button */
  .more-about-container {
    text-align: center;
    padding-bottom: 80px;
  }

  .more-about-btn {
    font-family: 'Poppins', sans-serif;
    font-size: 1.1rem;
    color: #40b3a2;
    text-decoration: none;
    border: 2px solid #40b3a2;
    padding: 12px 30px;
    border-radius: 30px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
  }

  .more-about-btn:hover {
    background-color: #40b3a2;
    color: #ffffff;
  }

  /* Mobile Responsive */
  @media (max-width: 900px) {
    .home-container {
      flex-direction: column-reverse;
      text-align: center;
      padding: 40px 20px;
      gap: 30px;
    }
    .name-row {
      justify-content: center;
    }
    .home-buttons {
      justify-content: center;
    }
    .home-image img {
      width: 250px;
      height: 250px;
    }
    .home-text h1 {
      font-size: 2.8rem;
    }
  }
</style>
