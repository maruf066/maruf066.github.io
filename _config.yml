<!-- _includes/nav.html -->
<style>
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: nowrap;
        padding: 10px 20px;
    }
    /* Left side: Avatar + Name */
    nav .left {
        display: flex;
        align-items: center;
        gap: 12px; /* Space between image and name */
    }
    nav .left img {
        width: 35px;
        height: 35px;
        border-radius: 50%; /* Makes the image circular */
        object-fit: cover;
    }
    nav .left a {
        font-weight: bold;
        font-size: 1.2rem; /* Slightly smaller to fit nicely next to the image */
        white-space: nowrap;
        text-decoration: none;
        color: inherit;
    }
    /* Right side: Links */
    nav .right.desktop-nav {
        display: flex;
        align-items: center;
        gap: 20px;
        white-space: nowrap;
    }
    nav .right.desktop-nav a {
        font-size: 1rem;
        text-decoration: none;
        color: inherit;
    }
    .menu-toggle, .mobile-nav { display: none; }
    @media (max-width: 900px) {
        .desktop-nav { display: none !important; }
        .menu-toggle { display: block; }
    }
</style>

<nav>
    <div class="left">
        <!-- Replace 'avatar.jpeg' with the exact name of your profile image -->
        <img src="{{ site.baseurl }}/assets/images/profile-image/avatar.jpeg" alt="Profile">
        <a href="{{ site.baseurl }}/">MD MARUF AHMED</a>
    </div>

    <!-- Desktop Menu -->
    <div class="right desktop-nav">
        <a href="{{ site.baseurl }}/"><span>Home</span></a>
        <a href="{{ site.baseurl }}/education/"><span>Education</span></a>
        <a href="{{ site.baseurl }}/research/"><span>Research</span></a>
        <a href="{{ site.baseurl }}/projects/"><span>Projects</span></a>
        <a href="{{ site.baseurl }}/experiences/"><span>Experience</span></a>
        <a href="{{site.resume-url}}" target="_blank" rel="noopener noreferrer"><span>Resume</span></a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" aria-label="Toggle menu">
        <i class="fa fa-bars fa-2x"></i>
    </button>

    <!-- Mobile Menu -->
    <div class="mobile-nav">
        <a href="{{ site.baseurl }}/"><span>Home</span></a>
        <a href="{{ site.baseurl }}/education/"><span>Education</span></a>
        <a href="{{ site.baseurl }}/research/"><span>Research</span></a>
        <a href="{{ site.baseurl }}/projects/"><span>Projects</span></a>
        <a href="{{ site.baseurl }}/experiences/"><span>Experience</span></a>
        <a href="{{site.resume-url}}" target="_blank" rel="noopener noreferrer"><span>Resume</span></a>
    </div>
